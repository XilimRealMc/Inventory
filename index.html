<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Inventaris</title>

<style>

body{
    font-family:sans-serif;
    padding:20px;
    background-color:#2c3e50;
    background-image:url('rex.png');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    max-width:1000px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
}

.sticky-tools{
    position:sticky;
    top:0;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

    background:#eee;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;

    border:2px solid #ccc;

    z-index:100;
}

button{
    border:none;
    padding:12px 24px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.btn-depo{
    background:#27ae60;
}

.btn-with{
    background:#c0392b;
}

.btn-depo:hover{
    background:#219150;
}

.btn-with:hover{
    background:#a93226;
}

#status{
    background:white;
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#333;
    color:white;
}

input[type="number"]{
    width:80px;
    padding:6px;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="container">

    <h2>DATABASE INVENTARIS</h2>

    <div class="sticky-tools">

        <button
            class="btn-depo"
            onclick="submitBatch('deposit')"
        >
            DEPOSIT SEMUA
        </button>

        <button
            class="btn-with"
            onclick="submitBatch('withdraw')"
        >
            WITHDRAW SEMUA
        </button>

        <div id="status">
            Memuat data...
        </div>

    </div>

    <table>

        <thead>
            <tr>
                <th>Nama Barang</th>
                <th>Kode</th>
                <th>Stok Saat Ini</th>
                <th>Jumlah Input</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzE7MI5KLTP0gHNVVYmhmjKBPJNdCkQs1F96P1tcsEiTp1_Rz_njm0rQ1NHE_EKH1nMFw/exec";

let itemCodes = [];

// ========================================
// LOAD DATA
// ========================================

async function loadData(){

    try{

        const response =
            await fetch(SCRIPT_URL);

        const data =
            await response.json();

        const tableBody =
            document.getElementById(
                'tableBody'
            );

        tableBody.innerHTML = '';

        itemCodes = [];

        for(let i = 1; i < data.length; i++){

            const kode = data[i][1];

            if(kode){

                itemCodes.push(kode);

                const row = `
                <tr>

                    <td>
                        ${data[i][3]}
                    </td>

                    <td>
                        ${kode}
                    </td>

                    <td style="font-size:18px;">
                        <b>${data[i][4]}</b>
                    </td>

                    <td>
                        <input
                            type="number"
                            id="input-${kode}"
                            placeholder="0"
                            min="0"
                        >
                    </td>

                </tr>
                `;

                tableBody.innerHTML += row;
            }
        }

        document.getElementById(
            'status'
        ).innerText = "✅ Data siap";

        document.getElementById(
            'status'
        ).style.color = "green";

    }catch(error){

        console.error(error);

        document.getElementById(
            'status'
        ).innerText =
            "❌ Gagal memuat data";

        document.getElementById(
            'status'
        ).style.color = "red";
    }
}

// ========================================
// SUBMIT TRANSAKSI
// ========================================

async function submitBatch(aksi){

    const itemsToProcess = [];

    itemCodes.forEach(kode => {

        const val =
            document.getElementById(
                `input-${kode}`
            ).value;

        if(
            val &&
            parseInt(val) > 0
        ){

            itemsToProcess.push({

                kode:kode,

                jumlah:parseInt(val)
            });
        }
    });

    // =========================
    // VALIDASI
    // =========================

    if(itemsToProcess.length === 0){

        alert(
            "Pilih minimal satu barang"
        );

        return;
    }

    // =========================
    // STATUS
    // =========================

    const btnStatus =
        document.getElementById(
            'status'
        );

    btnStatus.innerText =
        `⏳ Memproses ${itemsToProcess.length} item...`;

    btnStatus.style.color =
        "orange";

    try{

        // =========================
        // FETCH POST
        // =========================

        const response =
            await fetch(SCRIPT_URL, {

            method:'POST',

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                aksi:aksi,

                items:itemsToProcess
            })
        });

        // =========================
        // AMBIL TEXT
        // =========================

        const result =
            await response.text();

        console.log(result);

        // =========================
        // SUCCESS
        // =========================

        if(
            result.includes(
                "Proses Selesai"
            )
        ){

            alert(result);

            // reset input
            itemCodes.forEach(kode => {

                const el =
                    document.getElementById(
                        `input-${kode}`
                    );

                if(el){

                    el.value = '';
                }
            });

            btnStatus.innerText =
                "✅ Transaksi berhasil";

            btnStatus.style.color =
                "green";

            // reload data
            loadData();

        }else{

            alert(result);

            btnStatus.innerText =
                "❌ Transaksi gagal";

            btnStatus.style.color =
                "red";
        }

    }catch(error){

        console.error(error);

        alert(
            "❌ Tidak bisa terhubung ke server\n\n" +
            error.message
        );

        btnStatus.innerText =
            "❌ Koneksi gagal";

        btnStatus.style.color =
            "red";
    }
}

// ========================================
// START
// ========================================

loadData();

</script>

</body>
</html>
