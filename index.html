<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventaris Database</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#1e272e;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:25px;
}

.table-box{
    overflow-x:auto;
    background:#2f3640;
    border-radius:12px;
    padding:15px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#40739e;
    padding:12px;
}

td{
    background:#353b48;
    padding:10px;
    text-align:center;
    border-bottom:1px solid #444;
}

input[type="number"]{
    width:80px;
    padding:8px;
    border:none;
    border-radius:6px;
    text-align:center;
    font-weight:bold;
}

.action-box{
    display:flex;
    gap:8px;
    justify-content:center;
}

button{
    border:none;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    color:white;
}

.deposit{
    background:#27ae60;
}

.withdraw{
    background:#c0392b;
}

.deposit:hover{
    background:#2ecc71;
}

.withdraw:hover{
    background:#e74c3c;
}

.status{
    margin-top:20px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
}

.category{
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<h1>DATABASE INVENTARIS</h1>

<div class="table-box">

<table>

<thead>
<tr>
    <th>Kode</th>
    <th>Kategori</th>
    <th>Nama Barang</th>
    <th>Stok</th>
    <th>Jumlah</th>
    <th>Aksi</th>
</tr>
</thead>

<tbody id="inventory-body">

<!-- DATA MASUK DARI GOOGLE SHEETS -->

</tbody>

</table>

</div>

<div class="status" id="status">
    Memuat database...
</div>

</div>

<script>

// ======================================
// GANTI DENGAN URL APPS SCRIPT LU
// ======================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxFyJhW7WPxdpl9UMcGGEMMvL5qaDwWxFcb6EhzAfgOs4qt7v_EEo63zrv6BrOXiVGKBQ/exec";

// ======================================
// LOAD DATA
// ======================================

async function loadData(){

    try{

        const response =
            await fetch(SCRIPT_URL);

        const data =
            await response.json();

        const tbody =
            document.getElementById(
                "inventory-body"
            );

        tbody.innerHTML = "";

        // skip header
        for(let i = 1; i < data.length; i++){

            const row = data[i];

            const kode = row[1];
            const kategori = row[2];
            const nama = row[3];
            const stok = row[4];

            tbody.innerHTML += `

            <tr>

                <td>${kode}</td>

                <td class="category">
                    ${kategori}
                </td>

                <td>${nama}</td>

                <td id="stok-${kode}">
                    ${stok}
                </td>

                <td>

                    <input
                        type="number"
                        min="1"
                        value="1"
                        id="jumlah-${kode}"
                    >

                </td>

                <td>

                    <div class="action-box">

                        <button
                            class="deposit"
                            onclick="transaksi(
                                '${kode}',
                                'deposit'
                            )"
                        >
                            Deposit
                        </button>

                        <button
                            class="withdraw"
                            onclick="transaksi(
                                '${kode}',
                                'withdraw'
                            )"
                        >
                            Withdraw
                        </button>

                    </div>

                </td>

            </tr>
            `;
        }

        setStatus(
            "✅ Database berhasil dimuat",
            "#2ecc71"
        );

    }catch(err){

        console.error(err);

        setStatus(
            "❌ Gagal mengambil data",
            "#e74c3c"
        );
    }
}

// ======================================
// TRANSAKSI
// ======================================

async function transaksi(kode, aksi){

    const jumlah =
        parseInt(
            document.getElementById(
                `jumlah-${kode}`
            ).value
        );

    if(
        isNaN(jumlah) ||
        jumlah <= 0
    ){

        alert(
            "Jumlah tidak valid"
        );

        return;
    }

    setStatus(
        "⏳ Memproses transaksi...",
        "#f1c40f"
    );

    try{

        await fetch(SCRIPT_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify({

                aksi:aksi,

                kode:kode,

                jumlah:jumlah
            })
        });

        setStatus(
            `✅ ${aksi.toUpperCase()} berhasil`,
            "#2ecc71"
        );

        // reload data
        loadData();

    }catch(err){

        console.error(err);

        setStatus(
            "❌ Gagal mengirim transaksi",
            "#e74c3c"
        );
    }
}

// ======================================
// STATUS
// ======================================

function setStatus(text,color){

    const status =
        document.getElementById(
            "status"
        );

    status.innerText = text;
    status.style.color = color;
}

// ======================================
// START
// ======================================

loadData();

</script>

</body>
</html>
