<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Inventaris</title>

<style>

body{
    font-family:sans-serif;
    padding:20px;
    background:#2c3e50;
    background-image:url('rex.png');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    max-width:1000px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:20px;
    border-radius:10px;
}

h2{
    text-align:center;
}

.sticky-tools{
    position:sticky;
    top:0;

    display:flex;
    gap:10px;
    justify-content:center;
    align-items:center;

    background:#eee;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
}

button{
    border:none;
    padding:12px 24px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn-depo{
    background:#27ae60;
}

.btn-with{
    background:#c0392b;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}

th{
    background:#333;
    color:white;
}

input{
    width:80px;
    padding:6px;
}

#status{
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<h2>DATABASE INVENTARIS</h2>

<div class="sticky-tools">

<button
class="btn-depo"
onclick="submitBatch('deposit')">
DEPOSIT SEMUA
</button>

<button
class="btn-with"
onclick="submitBatch('withdraw')">
WITHDRAW SEMUA
</button>

<div id="status">
Memuat data...
</div>

</div>

<table>

<thead>
<tr>
<th>Nama Barang</th>
<th>Kode</th>
<th>Stok</th>
<th>Input</th>
</tr>
</thead>

<tbody id="tableBody"></tbody>

</table>

</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzE7MI5KLTP0gHNVVYmhmjKBPJNdCkQs1F96P1tcsEiTp1_Rz_njm0rQ1NHE_EKH1nMFw/exec";

let itemCodes = [];

// =====================================
// LOAD DATA
// =====================================

async function loadData(){

    try{

        const response =
            await fetch(SCRIPT_URL);

        const data =
            await response.json();

        const tableBody =
            document.getElementById(
                "tableBody"
            );

        tableBody.innerHTML = "";

        itemCodes = [];

        for(let i = 1; i < data.length; i++){

            const kode = data[i][1];

            if(kode){

                itemCodes.push(kode);

                tableBody.innerHTML += `
                <tr>

                    <td>${data[i][3]}</td>

                    <td>${kode}</td>

                    <td>
                        <b>${data[i][4]}</b>
                    </td>

                    <td>
                        <input
                        type="number"
                        id="input-${kode}"
                        placeholder="0"
                        min="0">
                    </td>

                </tr>
                `;
            }
        }

        setStatus(
            "✅ Database siap",
            "green"
        );

    }catch(err){

        console.error(err);

        setStatus(
            "❌ Gagal load data",
            "red"
        );
    }
}

// =====================================
// STATUS
// =====================================

function setStatus(text,color){

    const status =
        document.getElementById(
            "status"
        );

    status.innerText = text;

    status.style.color = color;
}

// =====================================
// SUBMIT
// =====================================

async function submitBatch(aksi){

    const itemsToProcess = [];

    itemCodes.forEach(kode => {

        const input =
            document.getElementById(
                `input-${kode}`
            );

        const jumlah =
            parseInt(input.value);

        if(
            !isNaN(jumlah) &&
            jumlah > 0
        ){

            itemsToProcess.push({

                kode:kode,

                jumlah:jumlah
            });
        }
    });

    if(itemsToProcess.length === 0){

        alert(
            "Isi minimal 1 barang"
        );

        return;
    }

    setStatus(
        "⏳ Memproses...",
        "orange"
    );

    try{

        const response =
            await fetch(SCRIPT_URL,{

            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({

                aksi:aksi,

                items:itemsToProcess
            })
        });

        // PENTING
        const result =
            await response.text();

        console.log(result);

        alert(result);

        if(
            result.includes(
                "Proses Selesai"
            )
        ){

            setStatus(
                "✅ Berhasil",
                "green"
            );

            // reset input
            itemCodes.forEach(kode => {

                const el =
                    document.getElementById(
                        `input-${kode}`
                    );

                if(el){

                    el.value = "";
                }
            });

            // reload data
            loadData();

        }else{

            setStatus(
                "❌ Gagal",
                "red"
            );
        }

    }catch(err){

        console.error(err);

        alert(
            "❌ Tidak bisa terhubung ke server"
        );

        setStatus(
            "❌ Koneksi gagal",
            "red"
        );
    }
}

// =====================================
// START
// =====================================

loadData();

</script>

</body>
</html>
