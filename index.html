<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Inventaris Interaktif</title>
    <style>
        body { 
            font-family: sans-serif; 
            padding: 20px; 
            background-color: #2c3e50;
            background-image: url('rex.png'); /* Ganti dengan nama file/URL gambar Anda */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { text-align: center; color: #333; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
        .sticky-tools { 
            position: sticky; top: 0; background: #eee; padding: 15px; 
            border-radius: 8px; margin-bottom: 20px; display: flex; 
            gap: 10px; z-index: 100; align-items: center; justify-content: center;
            border: 2px solid #ccc;
        }
        input[type="number"] { width: 70px; padding: 5px; font-weight: bold; }
        button { cursor: pointer; border: none; padding: 12px 24px; color: white; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .btn-depo { background: #27ae60; }
        .btn-with { background: #c0392b; }
        .btn-depo:hover { background: #219150; }
        .btn-with:hover { background: #a83226; }
        #status { font-weight: bold; color: #d35400; background: #fff; padding: 5px 10px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h2>DATABASE INVENTARIS</h2>
    
    <div class="sticky-tools">
        <button class="btn-depo" onclick="submitBatch('deposit')">DEPOSIT SEMUA</button>
        <button class="btn-with" onclick="submitBatch('withdraw')">WITHDRAW SEMUA</button>
        <div id="status">Memuat data dari database...</div>
    </div>

    <table id="inventoryTable">
        <thead>
            <tr>
                <th>Nama Barang</th>
                <th>Kode</th>
                <th>Stok Saat Ini</th>
                <th>Jumlah Input</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzE7MI5KLTP0gHNVVYmhmjKBPJNdCkQs1F96P1tcsEiTp1_Rz_njm0rQ1NHE_EKH1nMFw/exec"; // Wajib diisi dengan URL dari Apps Script
    let itemCodes = [];

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';
            itemCodes = [];
            
            for (let i = 1; i < data.length; i++) {
                const kode = data[i][1];
                if(kode) {
                    itemCodes.push(kode);
                    const row = `<tr>
                        <td>${data[i][3]}</td>
                        <td>${kode}</td>
                        <td style="font-size: 18px;"><b>${data[i][4]}</b></td>
                        <td><input type="number" id="input-${kode}" placeholder="0" min="0"></td>
                    </tr>`;
                    tableBody.innerHTML += row;
                }
            }
            document.getElementById('status').innerText = "✅ Data Siap";
            document.getElementById('status').style.color = "green";
        } catch (error) {
            document.getElementById('status').innerText = "❌ Gagal memuat data";
            document.getElementById('status').style.color = "red";
        }
    }

    async function submitBatch(aksi) {
        const itemsToProcess = [];
        
        itemCodes.forEach(kode => {
            const val = document.getElementById(`input-${kode}`).value;
            if (val && parseInt(val) > 0) {
                itemsToProcess.push({ kode: kode, jumlah: parseInt(val) });
            }
        });

        if (itemsToProcess.length === 0) return alert("Pilih dan isi minimal satu barang untuk diproses!");

        const btnStatus = document.getElementById('status');
        btnStatus.innerText = `⏳ Memproses ${itemsToProcess.length} item...`;
        btnStatus.style.color = "orange";
        
        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ aksi: aksi, items: itemsToProcess })
            });
            const result = await response.text();
            alert(result);
            
            // Mengosongkan input setelah sukses
            itemCodes.forEach(kode => {
                const el = document.getElementById(`input-${kode}`);
                if(el) el.value = '';
            });
            
            loadData(); 
        } catch (error) {
            alert("Gagal terhubung ke database. Periksa koneksi atau URL Apps Script.");
            btnStatus.innerText = "❌ Transaksi Gagal";
            btnStatus.style.color = "red";
        }
    }

    loadData();
</script>

</body>
</html>
