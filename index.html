<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Inventaris</title>

<style>

body{
    font-family:sans-serif;
    padding:20px;
    background:#2c3e50;
    background-image:url('rex.png');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
}

.container{
    max-width:1000px;
    margin:auto;
    background:rgba(255,255,255,0.95);
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
}

h2{
    text-align:center;
    color:#333;
}

.sticky-tools{
    position:sticky;
    top:0;
    z-index:100;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

    background:#eee;
    padding:15px;
    border-radius:10px;
    margin-bottom:20px;
    border:2px solid #ccc;
}

button{
    border:none;
    padding:12px 24px;
    border-radius:6px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.btn-depo{
    background:#27ae60;
}

.btn-with{
    background:#c0392b;
}

.btn-depo:hover{
    background:#219150;
}

.btn-with:hover{
    background:#a93226;
}

#status{
    background:white;
    padding:8px 12px;
    border-radius:6px;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:left;
}

th{
    background:#333;
    color:white;
}

input[type="number"]{
    width:80px;
    padding:6px;
    font-weight:bold;
}

.loading{
    opacity:0.6;
    pointer-events:none;
}

</style>
</head>

<body>

<div class="container">

    <h2>DATABASE INVENTARIS</h2>

    <div class="sticky-tools">

        <button
            class="btn-depo"
            onclick="submitBatch('deposit')"
        >
            DEPOSIT SEMUA
        </button>

        <button
            class="btn-with"
            onclick="submitBatch('withdraw')"
        >
            WITHDRAW SEMUA
        </button>

        <div id="status">
            Memuat database...
        </div>

    </div>

    <table>

        <thead>
            <tr>
                <th>Nama Barang</th>
                <th>Kode</th>
                <th>Stok</th>
                <th>Input</th>
            </tr>
        </thead>

        <tbody id="tableBody"></tbody>

    </table>

</div>

<script>

// ========================================
// URL APPS SCRIPT
// ========================================

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbzE7MI5KLTP0gHNVVYmhmjKBPJNdCkQs1F96P1tcsEiTp1_Rz_njm0rQ1NHE_EKH1nMFw/exec";

let itemCodes = [];

// ========================================
// STATUS
// ========================================

function setStatus(text,color){

    const status =
        document.getElementById("status");

    status.innerText = text;
    status.style.color = color;
}

// ========================================
// LOAD DATA
// ========================================

async function loadData(){

    try{

        setStatus(
            "⏳ Memuat database...",
            "orange"
        );

        const response =
            await fetch(SCRIPT_URL);

        const text =
            await response.text();

        console.log(text);

        const data =
            JSON.parse(text);

        const tableBody =
            document.getElementById("tableBody");

        tableBody.innerHTML = "";

        itemCodes = [];

        for(let i = 1; i < data.length; i++){

            const kode = data[i][1];

            if(kode){

                itemCodes.push(kode);

                tableBody.innerHTML += `
                <tr>

                    <td>
                        ${data[i][3]}
                    </td>

                    <td>
                        ${kode}
                    </td>

                    <td>
                        <b style="font-size:18px;">
                            ${data[i][4]}
                        </b>
                    </td>

                    <td>
                        <input
                            type="number"
                            id="input-${kode}"
                            placeholder="0"
                            min="0"
                        >
                    </td>

                </tr>
                `;
            }
        }

        setStatus(
            "✅ Database siap",
            "green"
        );

    }catch(err){

        console.error(err);

        setStatus(
            "❌ Gagal load database",
            "red"
        );

        alert(
            "Gagal mengambil data database"
        );
    }
}

// ========================================
// SUBMIT TRANSAKSI
// ========================================

async function submitBatch(aksi){

    const itemsToProcess = [];

    itemCodes.forEach(kode => {

        const input =
            document.getElementById(
                `input-${kode}`
            );

        const jumlah =
            parseInt(input.value);

        if(
            !isNaN(jumlah) &&
            jumlah > 0
        ){

            itemsToProcess.push({
                kode:kode,
                jumlah:jumlah
            });
        }
    });

    // =========================
    // VALIDASI
    // =========================

    if(itemsToProcess.length === 0){

        alert(
            "Isi minimal 1 barang"
        );

        return;
    }

    // =========================
    // UI LOADING
    // =========================

    document.body.classList.add(
        "loading"
    );

    setStatus(
        `⏳ Memproses ${aksi}...`,
        "orange"
    );

    try{

        // =========================
        // FETCH POST
        // =========================

        const response =
            await fetch(SCRIPT_URL,{

            method:"POST",

            redirect:"follow",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify({

                aksi:aksi,

                items:itemsToProcess
            })
        });

        const text =
            await response.text();

        console.log(text);

        const result =
            JSON.parse(text);

        // =========================
        // SUCCESS
        // =========================

        if(result.status){

            let pesan =
                `✅ ${aksi.toUpperCase()} BERHASIL\n\n`;

            result.logs.forEach(log => {

                pesan += log + "\n";
            });

            alert(pesan);

            // reset input
            itemCodes.forEach(kode => {

                const el =
                    document.getElementById(
                        `input-${kode}`
                    );

                if(el){

                    el.value = "";
                }
            });

            setStatus(
                "✅ Transaksi berhasil",
                "green"
            );

            // reload data
            await loadData();

        }else{

            alert(
                "❌ " +
                (
                    result.message ||
                    result.error
                )
            );

            setStatus(
                "❌ Transaksi gagal",
                "red"
            );
        }

    }catch(err){

        console.error(err);

        alert(
            "❌ Tidak bisa terhubung ke server\n\n" +
            err.message
        );

        setStatus(
            "❌ Koneksi gagal",
            "red"
        );

    }finally{

        document.body.classList.remove(
            "loading"
        );
    }
}

// ========================================
// START
// ========================================

loadData();

</script>

</body>
</html>
